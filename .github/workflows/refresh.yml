name: refresh
# Weekly: refetch every tracked bill from Congress.gov, find newly introduced bills in the current Congress,
# re-analyze the ones whose record changed, refresh the glossary and member roster, commit the data, then deploy.
# Needs repository secrets OPENROUTER_API_KEY and CONGRESS_API_KEY.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      force_analyze:
        description: "Re-run the analysis model on every bill (after a prompt change)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run the pipeline
        working-directory: pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          BACKROOM_TRIAGE_MODEL: ${{ vars.BACKROOM_TRIAGE_MODEL }}
          BACKROOM_ANALYSIS_MODEL: ${{ vars.BACKROOM_ANALYSIS_MODEL }}
        run: |
          uv sync
          uv run backroom fetch --force
          # Discover new bills in the sitting Congress: score every title+summary (cached, so only new bills cost anything),
          # then fetch and analyze whatever clears the cutoff. Two passes so timed-out batches get filled.
          uv run backroom triage ${{ vars.BACKROOM_CONGRESS || '119' }} --top 0
          uv run backroom triage ${{ vars.BACKROOM_CONGRESS || '119' }} --min-score ${{ vars.BACKROOM_MIN_SCORE || '13' }} --top 0 --fetch
          uv run backroom analyze ${{ inputs.force_analyze && '--force' || '' }}
          uv run backroom glossary
          uv run backroom members --force
      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "backroom-refresh[bot]"
          git config user.email "backroom-refresh[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No data changes."
          else
            git commit -m "data: scheduled refresh $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  # A push made with GITHUB_TOKEN does not trigger other workflows, so deploy explicitly.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
