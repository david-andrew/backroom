[project]
name = "tabled"
version = "0.1.0"
description = "Pipeline that finds and analyzes bills Congress declined to pass"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "toki[openrouter]>=1.5",
]

[project.scripts]
tabled = "tabled.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tabled"]
