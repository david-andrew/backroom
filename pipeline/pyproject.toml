[project]
name = "backroom"
version = "0.1.0"
description = "Backroom: finds and analyzes bills that help everyday people or serve concentrated power, and what Congress did with them"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "toki[openrouter]>=1.5",
]

[project.scripts]
backroom = "backroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backroom"]
